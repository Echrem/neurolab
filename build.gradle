plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        configureEach {
            workingDir = project.file('run')
            systemProperties.put('eventbus.api.strictRuntimeChecks', 'true')
            mods {
                neurolab {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {}
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.java.srcDirs = ['src/main/java', 'src/client/java']

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test { useJUnitPlatform() }

processResources {
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/mods.toml') {
        expand mod_version: project.mod_version
    }
}

jar {
    from('LICENSE') { rename { 'LICENSE_neurolab' } }
    from('DATA_PROVENANCE.md')
}
